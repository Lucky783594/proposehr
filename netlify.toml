[build]
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

# API routes FIRST - specific se general ki taraf
[[redirects]]
  from = "/api/create-proposal"
  to = "/.netlify/functions/create-proposal"
  status = 200

[[redirects]]
  from = "/api/get-proposal"
  to = "/.netlify/functions/get-proposal"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from = "/api/yes-clicked"
  to = "/.netlify/functions/yes-clicked"
  status = 200

[[redirects]]
  from = "/api/delete"
  to = "/.netlify/functions/delete"
  status = 200

# Proposal pages - /p/* ko proposal.html pe bhejna
[[redirects]]
  from = "/p/*"
  to = "/proposal.html"
  status = 200

# Admin
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# SPA fallback - SABSE LAST MEIN
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache"