[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/api/create"
  to = "/.netlify/functions/create-proposal"
  status = 200

[[redirects]]
  from = "/api/get"
  to = "/.netlify/functions/get-proposal"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from = "/api/yes"
  to = "/.netlify/functions/yes-clicked"
  status = 200

[[redirects]]
  from = "/api/delete"
  to = "/.netlify/functions/delete"
  status = 200

[[redirects]]
  from = "/p/*"
  to = "/proposal.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"