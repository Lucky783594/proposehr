<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Tumhare Liye 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Sacramento&family=DM+Sans:wght@300;400&family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600&family=Satisfy&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{overflow-x:hidden;min-height:100vh;}

/* LOADING */
#loading{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;background:#faf7f2;transition:opacity 0.6s;}
#loading.hide{opacity:0;pointer-events:none;}
.ld{width:10px;height:10px;border-radius:50%;display:inline-block;animation:ldB 0.8s ease-in-out infinite;}
.ld:nth-child(1){background:#c0525a;}
.ld:nth-child(2){background:#b8965a;animation-delay:0.15s;}
.ld:nth-child(3){background:#2d6a9f;animation-delay:0.3s;}
@keyframes ldB{0%,100%{transform:translateY(0);}50%{transform:translateY(-13px);}}
.ld-text{font-family:'Sacramento',cursive;font-size:26px;color:#8a6a6e;}

/* ERROR */
#error-page{display:none;position:fixed;inset:0;z-index:9998;background:#faf7f2;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:2rem;gap:1rem;font-family:'Cormorant Garamond',serif;}
#error-page.show{display:flex;}
#error-page h2{font-size:40px;color:#c0525a;}
#error-page p{font-size:18px;color:#8a6a6e;line-height:1.7;max-width:380px;}
#error-page a{display:inline-block;margin-top:1rem;padding:0.7rem 2rem;background:#c0525a;color:#fff;border-radius:8px;text-decoration:none;font-family:'DM Sans',sans-serif;font-size:14px;}

/* THEME WRAPPER */
.tw{display:none;}
.tw.on{display:block;}

/* SHARED SECTIONS */
section{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:4rem 2rem;position:relative;overflow:hidden;}

/* YES OVERLAY */
.yo{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:2rem;gap:1.5rem;}
.yo.on{display:flex;}
.yo-emoji{font-size:80px;animation:bIn 0.7s ease both;}
.yo-title{animation:fUp 1s ease 0.4s both;}
.yo-msg{animation:fUp 1s ease 0.7s both;max-width:380px;line-height:1.7;}

/* CONFETTI */
.cp{position:fixed;pointer-events:none;z-index:1001;animation:cFall 2.5s ease-in forwards;}
@keyframes cFall{0%{opacity:1;top:-5px;}100%{opacity:0;top:110vh;}}

/* SHARED ANIMATIONS */
@keyframes fUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes fIn{from{opacity:0;}to{opacity:1;}}
@keyframes sIn{from{opacity:0;transform:scale(0.85);}to{opacity:1;transform:scale(1);}}
@keyframes bIn{0%{transform:scale(0);opacity:0;}60%{transform:scale(1.3);}100%{transform:scale(1);opacity:1;}}
@keyframes spin{to{transform:rotate(360deg);}}

/* SCROLL HINT */
.sh{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:fUp 1s ease 2.2s forwards;}
.sh span{font-size:10px;letter-spacing:0.28em;text-transform:uppercase;}
.sh-line{width:1px;height:36px;animation:scrollPulse 1.5s ease-in-out infinite;}
@keyframes scrollPulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* MUSIC BTN */
.mb{position:fixed;bottom:1.5rem;right:1.5rem;width:42px;height:42px;border-radius:50%;border:none;color:#fff;font-size:17px;cursor:pointer;z-index:500;display:flex;align-items:center;justify-content:center;transition:transform 0.3s;}
.mb:hover{transform:scale(1.1);}

/* TIMELINE SHARED */
.tl{width:100%;max-width:540px;position:relative;}
.tl-item{display:flex;gap:1.8rem;margin-bottom:2.2rem;opacity:0;transform:translateX(-16px);transition:all 0.65s ease;}
.tl-item.vis{opacity:1;transform:translateX(0);}
.tl-dot{flex-shrink:0;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;position:relative;z-index:1;}

/* CARDS SHARED */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.2rem;max-width:740px;width:100%;}
.card-item{padding:1.5rem;opacity:0;transform:translateY(15px);transition:all 0.55s ease;}
.card-item.vis{opacity:1;transform:translateY(0);}

/* LETTER SHARED */
.letter-box{max-width:520px;width:100%;padding:2.8rem 2.4rem;opacity:0;transform:translateY(22px);transition:all 0.8s ease;}
.letter-box.vis{opacity:1;transform:translateY(0);}

/* BTNS SHARED */
.p-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;opacity:0;transition:all 0.8s ease 0.7s;position:relative;z-index:2;}
.p-btns.vis{opacity:1;}
.btn-no{cursor:pointer;transition:all 0.3s;}
.btn-no:hover{font-size:12px;opacity:0.5;}

/* ANIM HELPERS */
.a-fup{opacity:0;animation:fUp 1s ease forwards;}
.a-sin{opacity:0;animation:sIn 1s ease forwards;}
.a-fin{opacity:0;animation:fIn 1s ease forwards;}

/* ===== NO SCROLL on yes ===== */
body.no-scroll{overflow:hidden;}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}}
@media(max-width:480px){section{padding:3rem 1.5rem;}body{cursor:auto;}}


/* ================================================================
   T1 — ROMANTIC ROSE
================================================================ */
#t1{background:#faf7f2;color:#2a1a1c;}
#t1 .cur{position:fixed;width:16px;height:16px;background:#c0525a;border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);mix-blend-mode:multiply;transition:transform 0.1s;}
#t1 .petal{position:fixed;pointer-events:none;z-index:1;animation:petalFall linear infinite;opacity:0;}
@keyframes petalFall{0%{transform:translateY(-20px) rotate(0deg);opacity:0;}10%{opacity:0.7;}90%{opacity:0.3;}100%{transform:translateY(105vh) rotate(720deg);opacity:0;}}
#t1 .hero-sec{background:linear-gradient(160deg,#fff5f6,#fdf0f1 50%,#fff8ee);text-align:center;cursor:none;}

@keyframes glowP{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.12);}}
#t1 .hero-name{font-family:'Sacramento',cursive;font-size:clamp(78px,18vw,155px);color:#c0525a;line-height:0.9;text-shadow:2px 4px 40px rgba(192,82,90,0.15);}
#t1 .hero-tag{font-family:'Cormorant Garamond',serif;font-size:clamp(16px,3.5vw,23px);font-style:italic;font-weight:300;color:#6b4e52;margin-top:1.5rem;}
#t1 .sec-lbl{font-size:10px;letter-spacing:0.35em;text-transform:uppercase;color:#b8965a;margin-bottom:0.8rem;}
#t1 .sec-h{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,5.5vw,48px);font-weight:300;color:#2a1a1c;margin-bottom:2.5rem;text-align:center;}
#t1 .sec-h em{font-style:italic;color:#c0525a;}
#t1 .tl::before{content:'';position:absolute;left:21px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,#f7dde0,#f7dde0,transparent);}
#t1 .tl-dot{background:#fdf0f1;border:1.5px solid #f7dde0;}
#t1 .tl-h{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:#2a1a1c;margin-bottom:0.3rem;}
#t1 .tl-p{font-size:14px;color:#6b4e52;line-height:1.7;}
#t1 .card-item{background:#fff;border:1px solid rgba(192,82,90,0.1);border-radius:14px;}
#t1 .card-item h3{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:#2a1a1c;margin-bottom:0.4rem;}
#t1 .card-item p{font-size:13px;color:#6b4e52;line-height:1.6;}
#t1 .letter-box{background:#fff;border:1px solid rgba(184,150,90,0.2);border-radius:3px;box-shadow:0 8px 50px rgba(192,82,90,0.08);}
#t1 .letter-to{font-family:'Cormorant Garamond',serif;font-size:14px;font-style:italic;color:#6b4e52;margin-bottom:1.2rem;}
#t1 .letter-body{font-family:'Cormorant Garamond',serif;font-size:clamp(15px,2.5vw,18px);line-height:2;color:#2a1a1c;font-weight:300;}
#t1 .letter-body em{color:#c0525a;font-style:italic;}
#t1 .letter-sign{font-family:'Sacramento',cursive;font-size:32px;color:#c0525a;margin-top:1.5rem;}
#t1 .prop-sec{background:#2a1a1c;text-align:center;}
#t1 .prop-sec::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(192,82,90,0.13),transparent 70%);}
#t1 .p-big{font-family:'Sacramento',cursive;font-size:clamp(55px,13vw,110px);color:#fff;line-height:1;opacity:0;transform:scale(0.88);transition:all 1s ease;text-shadow:0 0 60px rgba(192,82,90,0.4);}
#t1 .p-big.vis{opacity:1;transform:scale(1);}
#t1 .p-nm{font-family:'Sacramento',cursive;font-size:clamp(65px,16vw,130px);color:#c0525a;line-height:1;margin-bottom:1.4rem;opacity:0;transform:scale(0.88);transition:all 1s ease 0.2s;text-shadow:0 0 80px rgba(192,82,90,0.5);}

#t1 .p-q{font-family:'Cormorant Garamond',serif;font-size:clamp(17px,3.5vw,25px);color:rgba(255,255,255,0.8);font-style:italic;font-weight:300;margin-bottom:2.8rem;max-width:460px;line-height:1.6;opacity:0;transition:all 0.8s ease 0.4s;}
#t1 .p-q.vis{opacity:1;}
#t1 .btn-yes{padding:0.9rem 2.8rem;background:#c0525a;color:#fff;border:none;border-radius:50px;font-family:'Cormorant Garamond',serif;font-size:19px;font-style:italic;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 28px rgba(192,82,90,0.4);}

#t1 .yo{background:#1a0e0f;}
#t1 .yo-title{font-family:'Sacramento',cursive;font-size:clamp(56px,13vw,108px);color:#c0525a;text-shadow:0 0 80px rgba(192,82,90,0.5);}

#t1 .sh span{color:#6b4e52;}
#t1 .sh-line{background:linear-gradient(to bottom,#c0525a,transparent);}


/* ================================================================
   T2 — COLLEGE NOTEBOOK
================================================================ */
#t2{background:#f5f0e8;color:#1a1a2e;}
#t2 .cur{position:fixed;width:10px;height:10px;background:#2d6a9f;border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);mix-blend-mode:multiply;}
#t2 .nb-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:repeating-linear-gradient(transparent,transparent 31px,rgba(212,207,198,0.55) 31px,rgba(212,207,198,0.55) 32px);background-size:100% 32px;opacity:0.5;}
#t2 .nb-bg::before{content:'';position:absolute;left:66px;top:0;bottom:0;width:1.5px;background:rgba(192,57,43,0.2);}
#t2 .spiral{position:fixed;left:0;top:0;bottom:0;width:33px;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;background:#ede8dc;border-right:1px solid #d4cfc6;}
#t2 .sh-hole{width:16px;height:16px;border-radius:50%;background:#f5f0e8;border:2px solid #bbb;}

@keyframes bookR{from{transform:perspective(800px) rotateY(-40deg) scale(0.9);opacity:0;}to{transform:perspective(800px) rotateY(0) scale(1);opacity:1;}}
#t2 .nb-cover::before{content:'';position:absolute;inset:0;border-radius:4px 12px 12px 4px;background-image:repeating-linear-gradient(transparent,transparent 27px,rgba(255,255,255,0.05) 27px,rgba(255,255,255,0.05) 28px);}
#t2 .cov-nm{font-family:'Dancing Script',cursive;font-size:clamp(55px,14vw,95px);color:#fff;line-height:0.9;position:relative;animation:nameW 1.8s ease 0.8s both;}
@keyframes nameW{from{opacity:0;letter-spacing:-0.08em;}to{opacity:1;letter-spacing:normal;}}
#t2 .cov-sub{font-family:'Playfair Display',serif;font-size:14px;font-style:italic;color:rgba(255,255,255,0.65);line-height:1.6;position:relative;margin-top:1rem;}
#t2 .cov-sticker{position:absolute;bottom:-14px;right:-14px;width:54px;height:54px;background:#c9a84c;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,0.2);animation:stickerP 0.5s cubic-bezier(0.34,1.56,0.64,1) 1.6s both;}
@keyframes stickerP{from{transform:scale(0) rotate(-30deg);}to{transform:scale(1) rotate(-8deg);}}
#t2 .pg-tag{font-size:10px;letter-spacing:0.4em;text-transform:uppercase;color:#2d6a9f;margin-bottom:0.8rem;display:flex;align-items:center;gap:8px;}
#t2 .pg-tag::before,#t2 .pg-tag::after{content:'';flex:1;height:1px;background:rgba(45,106,159,0.18);}
#t2 .pg-h{font-family:'Playfair Display',serif;font-size:clamp(25px,5vw,42px);font-weight:400;color:#1a1a2e;margin-bottom:2.8rem;text-align:center;line-height:1.2;}
#t2 .pg-h em{font-style:italic;color:#2d6a9f;}
#t2 .tl{max-width:560px;}
#t2 .tl::before{content:'';position:absolute;left:83px;top:0;bottom:0;width:1px;background:rgba(192,57,43,0.25);}
#t2 .c-ti{display:grid;grid-template-columns:83px 1fr;gap:1.4rem;margin-bottom:2.4rem;opacity:0;transform:translateX(-14px);transition:all 0.6s ease;}
#t2 .c-ti.vis{opacity:1;transform:translateX(0);}
#t2 .c-date{font-family:'Dancing Script',cursive;font-size:13px;color:#c0392b;text-align:right;padding-top:3px;line-height:1.4;}
#t2 .c-box{background:#fff;border:1px solid #d4cfc6;border-radius:2px;padding:1rem 1.2rem;position:relative;box-shadow:2px 2px 7px rgba(0,0,0,0.04);}
#t2 .c-box::after{content:'';position:absolute;top:0;right:0;width:15px;height:15px;background:linear-gradient(225deg,#ede8dc 50%,transparent 50%);border-left:1px solid #d4cfc6;border-bottom:1px solid #d4cfc6;}

#t2 .card-item p{font-size:13px;color:#6b6560;line-height:1.6;}
#t2 .letter-box{background:#fff;border:1px solid #d4cfc6;box-shadow:0 2px 0 #d4cfc6,0 4px 0 #e8e3d8,4px 8px 28px rgba(0,0,0,0.07);}
#t2 .letter-box::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(transparent,transparent 27px,rgba(212,207,198,0.45) 27px,rgba(212,207,198,0.45) 28px);pointer-events:none;}
#t2 .letter-to{font-family:'Playfair Display',serif;font-size:13px;font-style:italic;color:#6b6560;margin-bottom:1.2rem;position:relative;}
#t2 .letter-body{font-family:'Playfair Display',serif;font-size:clamp(14px,2.5vw,17px);line-height:2;color:#1a1a2e;font-weight:400;position:relative;}

#t2 .p-sec{background:#2d6a9f;text-align:center;}

/* ================================================================
   T3 — STARRY NIGHT
================================================================ */
#t3{background:#0a0e1a;color:#e8e4f0;}
#t3 .cur{position:fixed;width:8px;height:8px;background:#f5d76e;border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);box-shadow:0 0 8px #f5d76e;}

#t3 .hero-nm{font-family:'Cinzel',serif;font-size:clamp(38px,9vw,85px);color:#f5d76e;letter-spacing:0.1em;text-shadow:0 0 40px rgba(245,215,110,0.4);}
#t3 .hero-tag{font-family:'Cormorant Garamond',serif;font-size:clamp(15px,3vw,21px);font-style:italic;color:rgba(232,228,240,0.65);margin-top:1rem;}
#t3 .sec-lbl{font-size:10px;letter-spacing:0.38em;text-transform:uppercase;color:rgba(245,215,110,0.7);margin-bottom:0.8rem;}
#t3 .sec-h{font-family:'Cinzel',serif;font-size:clamp(22px,5vw,40px);color:#e8e4f0;margin-bottom:2.5rem;text-align:center;letter-spacing:0.05em;}
#t3 .sec-h em{color:#f5d76e;font-style:normal;}
#t3 .tl::before{content:'';position:absolute;left:19px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,rgba(245,215,110,0.28),rgba(245,215,110,0.28),transparent);}
#t3 .tl-dot{background:rgba(245,215,110,0.1);border:1px solid rgba(245,215,110,0.28);}

<script>
let proposalId = null;
let activeThemeId = 1;

const THEME_MAP = {
  romantic:1, college:2, starry:3, royale:4, garden:5,
  sunset:6, fairy:7, vintage:8, ocean:9, mountains:10,
  rain:11, midnight:12, spring:13, autumn:14, neon:15,
  minimal:16, retro:17, bollywood:18, poetry:19, lofi:20
};

function getIdFromUrl() {
  const m = window.location.pathname.match(/\/p\/([^/?#]+)/);
  return m ? m[1] : null;
}

async function init() {
  proposalId = getIdFromUrl();
  if (!proposalId) { showErr(); return; }

  try {
    const res = await fetch(`/.netlify/functions/get-proposal?id=${encodeURIComponent(proposalId)}`);
    if (!res.ok) { showErr(); return; }

    const data = await res.json();
    if (!data || !data.girlfriend_name) { showErr(); return; }

    const name = data.girlfriend_name;
    activeThemeId = THEME_MAP[data.theme] || 1;

    // Set name in active theme
    const setEl = (id, val) => { const e = document.getElementById(id); if(e) e.textContent = val; };
    setEl(`nm${activeThemeId}`, name);
    setEl(`ln${activeThemeId}`, name);
    setEl(`pn${activeThemeId}`, activeThemeId === 1 ? name + '?' : name);
    const pb = document.getElementById(`pb${activeThemeId}`);
    if (pb && !pb.id.endsWith('_btns')) pb.textContent = themeData[activeThemeId-1].propBig;

    // Custom message
    if (data.message) {
      const lb = document.querySelector(`#t${activeThemeId} .letter-body`);
      if (lb) lb.innerHTML += `<br><br><em>"${escHtml(data.message)}"</em>`;
    }

    // Activate theme
    document.getElementById('t' + activeThemeId)?.classList.add('on');
    initTheme(activeThemeId);

    // Hide loading
    setTimeout(() => {
      const ld = document.getElementById('loading');
      ld.classList.add('hide');
      setTimeout(() => ld.style.display = 'none', 600);
    }, 700);

    // Scroll anim
    setTimeout(initScrollAnim, 200);

  } catch(e) {
    console.error(e);
    showErr();
  }
}

function showErr() {
  const ld = document.getElementById('loading');
  ld.classList.add('hide');
  setTimeout(() => {
    ld.style.display = 'none';
    document.getElementById('error-page').classList.add('show');
  }, 500);
}

function initTheme(n) {
  // Cursor
  const cur = document.getElementById('c' + n);
  if (cur) {
    document.addEventListener('mousemove', e => {
      cur.style.left = e.clientX + 'px';
      cur.style.top = e.clientY + 'px';
    });
  }

  if (n === 1) {
    // Petals
    const em = ['🌸','🌺','💮','✿','🌹'];
    function petal() {
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = em[Math.floor(Math.random()*em.length)];
      p.style.cssText = `left:${Math.random()*100}vw;font-size:${12+Math.random()*14}px;animation-duration:${7+Math.random()*8}s;animation-delay:${Math.random()*4}s;`;
      document.getElementById('petals1')?.appendChild(p);
      setTimeout(() => p.remove(), 15000);
    }
    setInterval(petal, 1000);
    // Music
    let playing=false, actx, gain, ni=0;
    const notes=[261.63,293.66,329.63,392,349.23,392,440,392];
    document.getElementById('mus1')?.addEventListener('click', () => {
      if(!playing){
        actx=new(window.AudioContext||window.webkitAudioContext)();
        gain=actx.createGain(); gain.gain.setValueAtTime(0.05,actx.currentTime); gain.connect(actx.destination);
        playing=true; document.getElementById('mus1').textContent='♫';
        (function play(){
          if(!playing)return;
          const o=actx.createOscillator(); o.type='sine';
          o.frequency.setValueAtTime(notes[ni%notes.length],actx.currentTime);
          o.connect(gain); o.start(); o.stop(actx.currentTime+0.4); ni++;
          setTimeout(play,520);
        })();
      } else {
        playing=false; document.getElementById('mus1').textContent='♪';
        actx?.close();
      }
    });
  }

  if (n === 2) {
    const sp = document.getElementById('sp2');
    if(sp) for(let i=0;i<20;i++){const h=document.createElement('div');h.className='sh-hole';sp.appendChild(h);}
  }

  if (n === 3) {
    const sb = document.getElementById('sb3');
    if(sb) for(let i=0;i<80;i++){const s=document.createElement('div');s.className='star-dot';const sz=1+Math.random()*3;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*3}s;`;sb.appendChild(s);}
  }

  if (n === 5) {
    const lv = document.getElementById('leaves5');
    const le=['🍃','🌿','🍀','☘️'];
    function leaf(){const l=document.createElement('div');l.className='leaf';l.textContent=le[Math.floor(Math.random()*le.length)];l.style.cssText=`left:${Math.random()*100}vw;animation-duration:${9+Math.random()*10}s;animation-delay:${Math.random()*5}s;`;lv?.appendChild(l);setTimeout(()=>l.remove(),22000);}
    setInterval(leaf,1300);
  }

  if (n === 7) {
    const sp7 = document.getElementById('sparkles7');
    const se=['✨','⭐','💫','🌟'];
    if(sp7) for(let i=0;i<15;i++){const s=document.createElement('div');s.className='sparkle';s.textContent=se[Math.floor(Math.random()*se.length)];s.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*100}vh;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s;`;sp7.appendChild(s);}
  }

  // Proposal intersection observer
  const propSec = document.querySelector(`#t${n} section:last-of-type`);
  if (propSec) {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const ids = [`pb${n}`, `pn${n}`, `pq${n}`, `pb${n}_btns`];
          ids.forEach((id, i) => setTimeout(() => document.getElementById(id)?.classList.add('vis'), i * 180));
        }
      });
    }, { threshold: 0.25 });
    obs.observe(propSec);
  }
}

function initScrollAnim() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.15 });
  document.querySelectorAll(`#t${activeThemeId} .tl-item, #t${activeThemeId} .card-item, #t${activeThemeId} .letter-box, #t${activeThemeId} .c-ti`).forEach((el, i) => {
    el.style.transitionDelay = (i % 6 * 0.1) + 's';
    obs.observe(el);
  });
}

const noTries = {};
function moveNo(id) {
  noTries[id] = (noTries[id] || 0) + 1;
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.style.position = 'fixed'; btn.style.zIndex = '600';
  btn.style.transition = 'all 0.4s cubic-bezier(0.34,1.56,0.64,1)';
  btn.style.left = Math.min(Math.max(Math.random()*82, 4), 85) + 'vw';
  btn.style.top = Math.min(Math.max(Math.random()*80, 10), 85) + 'vh';
  const t = noTries[id];
  if (t > 4) btn.style.opacity = '0.2';
  if (t > 7) btn.style.display = 'none';
}

async function sayYes(n) {
  try {
    await fetch('/.netlify/functions/yes-clicked', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: proposalId })
    });
  } catch(e) {}
  document.getElementById('yo' + n)?.classList.add('on');
  document.body.classList.add('no-scroll');
  launchConfetti(n);
}

const confColors = {
  1:['#c0525a','#f7dde0','#b8965a','#fff'],2:['#2d6a9f','#c9a84c','#fff','#1a1a2e'],
  3:['#f5d76e','#0a0e1a','#fff'],4:['#d4af37','#0d0b08','#f0e6cc'],
  5:['#2d7a2d','#7ec87e','#fff'],6:['#e8621a','#ffb347','#fff'],
  7:['#c084fc','#9333ea','#fff'],8:['#d4a820','#1a1408','#f0e6c8'],
  9:['#4fc3f7','#0a1628','#fff'],10:['#8bc34a','#1a2010','#fff'],
  11:['#90caf9','#1a1e2e','#fff'],12:['#e040fb','#050510','#fff'],
  13:['#e91e8c','#fff5f8','#fff'],14:['#ff8f00','#1e1008','#f8e8c8'],
  15:['#ff00ff','#0a0015','#fff'],16:['#111','#fafafa','#555'],
  17:['#ff1493','#1a0030','#fff'],18:['#ff6f00','#1a0808','#fff'],
  19:['#8d6e63','#f8f4ee','#fff'],20:['#f48fb1','#1a1a2e','#fff']
};

function launchConfetti(n) {
  const cols = confColors[n] || ['#c0525a','#fff'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'cp';
    const sz = 5 + Math.random()*8;
    c.style.cssText = `left:${Math.random()*100}vw;background:${cols[Math.floor(Math.random()*cols.length)]};width:${sz}px;height:${sz}px;border-radius:${Math.random()>0.5?'50%':'2px'};transform:rotate(${Math.random()*360}deg);animation-delay:${Math.random()*1.5}s;animation-duration:${2+Math.random()*1.5}s;`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
